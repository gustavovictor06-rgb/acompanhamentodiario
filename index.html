<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Ligações</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0b0f14;
    --bg-elevated: #121820;
    --bg-input: #0e131a;
    --border: #202834;
    --border-soft: #1a212b;
    --text-primary: #eef2f6;
    --text-secondary: #8b97a5;
    --text-faint: #5b6673;
    --accent: #35e0c2;
    --accent-dim: #1f8f7d;
    --accent-soft: rgba(53, 224, 194, 0.12);
    --efetuada: #35e0c2;
    --recebida: #7aa2ff;
    --danger: #f2685f;
    --danger-soft: rgba(242, 104, 95, 0.12);
    --radius: 12px;
    --font-ui: 'Manrope', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, monospace;
  }

  *{ box-sizing: border-box; }
  html, body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--text-primary);
    font-family: var(--font-ui);
    min-height: 100vh;
    padding: 32px 20px 80px;
  }

  .wrap{ max-width: 1080px; margin: 0 auto; }

  /* Header */
  header{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap: 20px;
    margin-bottom: 28px;
    flex-wrap: wrap;
  }
  .brand{ display:flex; align-items:center; gap: 12px; }
  .brand-mark{
    width: 40px; height:40px; border-radius: 10px;
    background: linear-gradient(155deg, var(--accent), var(--accent-dim));
    display:flex; align-items:center; justify-content:center;
    font-family: var(--font-mono); font-weight:600; color:#04211b; font-size: 15px;
    flex-shrink:0;
  }
  h1{ font-size: 20px; font-weight: 800; margin:0; letter-spacing:-0.01em; }
  .brand-sub{ color: var(--text-secondary); font-size: 13px; margin-top:2px; }
  #clock{
    font-family: var(--font-mono); color: var(--text-secondary); font-size: 13px;
    text-align: right; padding-top: 6px;
  }
  #clock strong{ color: var(--text-primary); font-weight:600; }

  /* Stat groups */
  .stats-grid{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    margin-bottom: 28px;
  }
  .stat-card{
    background: var(--bg-elevated);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius);
    padding: 18px 18px 16px;
  }
  .stat-card .period{
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-faint);
    font-weight: 700;
    margin-bottom: 14px;
  }
  .stat-row{ display:flex; justify-content:space-between; gap:10px; }
  .stat-item{ flex:1; }
  .stat-num{ font-family: var(--font-mono); font-size: 22px; font-weight: 600; line-height:1; }
  .stat-label{ font-size: 11.5px; color: var(--text-secondary); margin-top: 6px; }
  .stat-item.efetuadas .stat-num{ color: var(--efetuada); }
  .stat-item.recebidas .stat-num{ color: var(--recebida); }
  .stat-item.total .stat-num{ color: var(--text-primary); }

  /* Period toggle */
  .period-toggle{
    display:inline-flex;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 3px;
    gap: 3px;
    margin-bottom: 18px;
  }
  .period-opt{
    background: transparent;
    border: none;
    color: var(--text-secondary);
    font-family: var(--font-ui);
    font-size: 13px;
    font-weight: 700;
    padding: 8px 16px;
    border-radius: 6px;
    cursor: pointer;
    transition: all .15s ease;
  }
  .period-opt.active{
    background: var(--accent-soft);
    color: var(--accent);
  }
  .period-opt:hover:not(.active){ color: var(--text-primary); }

  .stat-row.top-level{ display:flex; gap: 14px; }
  .stat-row.top-level .stat-item{
    background: var(--bg-input);
    border: 1px solid var(--border-soft);
    border-radius: 10px;
    padding: 16px 18px;
    flex: 1;
  }
  .stat-row.top-level .stat-num{ font-size: 28px; }

  /* Chart */
  .chart-sub{ color: var(--text-secondary); font-size: 12.5px; margin: -10px 0 18px; }
  .chart-legend{ display:flex; gap:18px; margin-bottom: 18px; flex-wrap: wrap; }
  .chart-legend .item{ display:flex; align-items:center; gap:7px; font-size: 12.5px; color: var(--text-secondary); }
  .chart-legend .swatch{ width:10px; height:10px; border-radius:3px; }

  /* Cards */
  .card{
    background: var(--bg-elevated);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius);
    padding: 22px;
    margin-bottom: 22px;
  }
  .card h2{
    font-size: 15px;
    font-weight: 700;
    margin: 0 0 18px;
    display:flex; align-items:center; gap:8px;
  }
  .card h2 .dot{ width:6px; height:6px; border-radius:50%; background: var(--accent); }

  /* Form */
  .form-grid{
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
  }
  .field{ display:flex; flex-direction:column; gap:6px; }
  .field.span-2{ grid-column: span 2; }
  .field.span-4{ grid-column: span 4; }
  label{ font-size: 12px; color: var(--text-secondary); font-weight: 600; }
  input, select, textarea{
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    color: var(--text-primary);
    font-family: var(--font-ui);
    font-size: 14px;
    outline: none;
    transition: border-color .15s ease;
    width: 100%;
  }
  input:focus, select:focus, textarea:focus{ border-color: var(--accent); }
  input::placeholder, textarea::placeholder{ color: var(--text-faint); }
  textarea{ resize: vertical; min-height: 44px; font-family: var(--font-ui); }

  .tipo-toggle{ display:flex; gap:8px; }
  .tipo-toggle input{ display:none; }
  .tipo-toggle label.opt{
    flex:1;
    text-align:center;
    padding: 10px 8px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg-input);
    color: var(--text-secondary);
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: all .15s ease;
  }
  .tipo-toggle input:checked + label.opt.efetuada{
    background: var(--accent-soft); border-color: var(--accent); color: var(--efetuada);
  }
  .tipo-toggle input:checked + label.opt.recebida{
    background: rgba(122,162,255,0.12); border-color: var(--recebida); color: var(--recebida);
  }

  .form-actions{ margin-top: 18px; display:flex; justify-content:flex-end; }
  button.primary{
    background: var(--accent);
    color: #04211b;
    border: none;
    padding: 11px 22px;
    border-radius: 8px;
    font-family: var(--font-ui);
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    transition: transform .1s ease, filter .15s ease;
  }
  button.primary:hover{ filter: brightness(1.08); }
  button.primary:active{ transform: scale(0.98); }

  /* Filters */
  .filters{
    display:flex; gap: 10px; flex-wrap: wrap; align-items:flex-end; margin-bottom: 16px;
  }
  .filters .field{ min-width: 160px; }
  .filters .field.grow{ flex:1; min-width: 200px; }
  .btn-ghost{
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-secondary);
    padding: 10px 14px;
    border-radius: 8px;
    font-family: var(--font-ui);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-ghost:hover{ border-color: var(--text-faint); color: var(--text-primary); }

  /* Table */
  .table-scroll{ overflow-x: auto; }
  table{ width:100%; border-collapse: collapse; font-size: 13.5px; }
  thead th{
    text-align:left;
    color: var(--text-faint);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-weight: 700;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  tbody td{
    padding: 12px 10px;
    border-bottom: 1px solid var(--border-soft);
    vertical-align: top;
  }
  tbody tr:hover{ background: rgba(255,255,255,0.015); }
  .mono{ font-family: var(--font-mono); color: var(--text-secondary); font-size: 12.5px; }
  .badge{
    display:inline-block;
    padding: 3px 9px;
    border-radius: 100px;
    font-size: 11.5px;
    font-weight: 700;
  }
  .badge.efetuada{ background: var(--accent-soft); color: var(--efetuada); }
  .badge.recebida{ background: rgba(122,162,255,0.12); color: var(--recebida); }
  .tag{
    display:inline-block;
    padding: 3px 9px;
    border-radius: 6px;
    font-size: 11.5px;
    font-weight: 600;
    background: var(--border-soft);
    color: var(--text-secondary);
    border: 1px solid var(--border);
  }
  .obs-cell{ color: var(--text-secondary); max-width: 220px; }
  .del-btn{
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-faint);
    width: 28px; height:28px;
    border-radius: 7px;
    cursor: pointer;
    font-size: 14px;
    line-height:1;
  }
  .del-btn:hover{ border-color: var(--danger); color: var(--danger); background: var(--danger-soft); }

  .empty-state{
    text-align:center;
    padding: 40px 20px;
    color: var(--text-faint);
    font-size: 13.5px;
  }

  footer{
    text-align:center;
    color: var(--text-faint);
    font-size: 12px;
    margin-top: 30px;
  }

  @media (max-width: 720px){
    .stats-grid{ grid-template-columns: 1fr; }
    .form-grid{ grid-template-columns: repeat(2,1fr); }
    .field.span-2{ grid-column: span 2; }
    .field.span-4{ grid-column: span 2; }
  }
  @media (max-width: 420px){
    .form-grid{ grid-template-columns: 1fr; }
    .field.span-2, .field.span-4{ grid-column: span 1; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <div class="brand-mark">PL</div>
      <div>
        <h1>Painel de Ligações</h1>
        <div class="brand-sub">Registro e acompanhamento diário de atendimentos</div>
      </div>
    </div>
    <div id="clock"></div>
  </header>

  <div class="card">
    <h2><span class="dot"></span>Resumo</h2>
    <div class="period-toggle" id="periodToggle">
      <button type="button" class="period-opt active" data-period="dia">Hoje</button>
      <button type="button" class="period-opt" data-period="semana">Esta semana</button>
      <button type="button" class="period-opt" data-period="mes">Este mês</button>
    </div>
    <div class="stat-row" id="statsRow"></div>
  </div>

  <div class="card">
    <h2><span class="dot"></span>Registrar ligação</h2>
    <form id="callForm">
      <div class="form-grid">
        <div class="field">
          <label>Protocolo</label>
          <input type="text" id="protocolo" placeholder="Nº do protocolo">
        </div>
        <div class="field">
          <label>Nome do cliente</label>
          <input type="text" id="nome" placeholder="Ex: Maria Souza" required>
        </div>
        <div class="field">
          <label>CPF</label>
          <input type="text" id="cpf" placeholder="000.000.000-00">
        </div>
        <div class="field">
          <label>Instalação</label>
          <input type="text" id="instalacao" placeholder="Nº da instalação">
        </div>

        <div class="field span-2">
          <label>Tipo de ligação</label>
          <select id="tipoLigacao" required>
            <option value="" disabled selected>Selecione</option>
            <option>Cancelamento</option>
            <option>Pós Cancelamento</option>
            <option>Transferência</option>
            <option>Retenção</option>
            <option>Reativação</option>
            <option>Dúvida</option>
          </select>
        </div>
        <div class="field span-2">
          <label>Chamada</label>
          <div class="tipo-toggle">
            <input type="radio" name="tipoChamada" id="tc-efetuada" value="efetuada" checked>
            <label class="opt efetuada" for="tc-efetuada">Efetuada</label>
            <input type="radio" name="tipoChamada" id="tc-recebida" value="recebida">
            <label class="opt recebida" for="tc-recebida">Recebida</label>
          </div>
        </div>

        <div class="field span-4">
          <label>Observação (opcional)</label>
          <textarea id="observacao" placeholder="Detalhes sobre o atendimento..."></textarea>
        </div>
      </div>
      <div class="form-actions">
        <button type="submit" class="primary">Registrar ligação</button>
      </div>
    </form>
  </div>

  <div class="card">
    <h2><span class="dot"></span>Histórico</h2>
    <div class="filters">
      <div class="field">
        <label>Data</label>
        <input type="date" id="filterDate">
      </div>
      <div class="field">
        <label>Chamada</label>
        <select id="filterChamada">
          <option value="">Todas</option>
          <option value="efetuada">Efetuada</option>
          <option value="recebida">Recebida</option>
        </select>
      </div>
      <div class="field">
        <label>Tipo</label>
        <select id="filterTipo">
          <option value="">Todos</option>
          <option>Cancelamento</option>
          <option>Pós Cancelamento</option>
          <option>Transferência</option>
          <option>Retenção</option>
          <option>Reativação</option>
          <option>Dúvida</option>
        </select>
      </div>
      <div class="field grow">
        <label>Buscar</label>
        <input type="text" id="filterSearch" placeholder="Nome, CPF, instalação ou protocolo">
      </div>
      <button class="btn-ghost" id="clearFilters">Limpar filtros</button>
    </div>

    <div class="table-scroll">
      <table id="callsTable">
        <thead>
          <tr>
            <th>Data / hora</th>
            <th>Chamada</th>
            <th>Tipo</th>
            <th>Cliente</th>
            <th>CPF</th>
            <th>Instalação</th>
            <th>Protocolo</th>
            <th>Observação</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="callsBody"></tbody>
      </table>
      <div class="empty-state" id="emptyState" style="display:none;">Nenhuma ligação registrada ainda.</div>
    </div>
  </div>

  <div class="card">
    <h2><span class="dot"></span>Comparativo mensal</h2>
    <div class="chart-sub">Mês atual vs. mês anterior</div>
    <div id="monthChart"></div>
  </div>

  <footer>Dados salvos apenas neste navegador.</footer>
</div>

<script>
const STORAGE_KEY = 'painelLigacoes.registros';

function loadCalls(){
  try{
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
  }catch(e){ return []; }
}
function saveCalls(calls){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(calls));
}

let calls = loadCalls();

// ---------- Clock ----------
function updateClock(){
  const now = new Date();
  const dateStr = now.toLocaleDateString('pt-BR', { weekday:'long', day:'2-digit', month:'long' });
  const timeStr = now.toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' });
  document.getElementById('clock').innerHTML = `${dateStr}<br><strong>${timeStr}</strong>`;
}
updateClock();
setInterval(updateClock, 30000);

// ---------- Date helpers ----------
function startOfDay(d){ const x = new Date(d); x.setHours(0,0,0,0); return x; }
function startOfWeek(d){
  const x = startOfDay(d);
  const day = x.getDay(); // 0 = domingo
  x.setDate(x.getDate() - day);
  return x;
}
function startOfMonth(d){ const x = startOfDay(d); x.setDate(1); return x; }

function countInRange(list, from){
  const now = new Date();
  const filtered = list.filter(c => new Date(c.dataHora) >= from && new Date(c.dataHora) <= now);
  return {
    efetuadas: filtered.filter(c => c.tipoChamada === 'efetuada').length,
    recebidas: filtered.filter(c => c.tipoChamada === 'recebida').length,
    total: filtered.length
  };
}

let currentPeriod = 'dia';

function periodFrom(period){
  const now = new Date();
  if (period === 'semana') return startOfWeek(now);
  if (period === 'mes') return startOfMonth(now);
  return startOfDay(now);
}

function renderStats(){
  const s = countInRange(calls, periodFrom(currentPeriod));
  const row = document.getElementById('statsRow');
  row.className = 'stat-row top-level';
  row.innerHTML = `
    <div class="stat-item efetuadas">
      <div class="stat-num">${s.efetuadas}</div>
      <div class="stat-label">Efetuadas</div>
    </div>
    <div class="stat-item recebidas">
      <div class="stat-num">${s.recebidas}</div>
      <div class="stat-label">Recebidas</div>
    </div>
    <div class="stat-item total">
      <div class="stat-num">${s.total}</div>
      <div class="stat-label">Total</div>
    </div>`;
}

document.getElementById('periodToggle').addEventListener('click', (e) => {
  const btn = e.target.closest('.period-opt');
  if (!btn) return;
  currentPeriod = btn.dataset.period;
  document.querySelectorAll('.period-opt').forEach(b => b.classList.toggle('active', b === btn));
  renderStats();
});

// ---------- Monthly comparison chart ----------
function monthRange(offsetMonths){
  const now = new Date();
  const from = new Date(now.getFullYear(), now.getMonth() + offsetMonths, 1);
  const to = new Date(now.getFullYear(), now.getMonth() + offsetMonths + 1, 1);
  return { from, to };
}

function countInMonth(list, from, to){
  const filtered = list.filter(c => {
    const d = new Date(c.dataHora);
    return d >= from && d < to;
  });
  return {
    efetuadas: filtered.filter(c => c.tipoChamada === 'efetuada').length,
    recebidas: filtered.filter(c => c.tipoChamada === 'recebida').length,
    total: filtered.length
  };
}

function renderMonthChart(){
  const prevRange = monthRange(-1);
  const currRange = monthRange(0);
  const prev = countInMonth(calls, prevRange.from, prevRange.to);
  const curr = countInMonth(calls, currRange.from, currRange.to);

  const prevLabel = prevRange.from.toLocaleDateString('pt-BR', { month:'long' });
  const currLabel = currRange.from.toLocaleDateString('pt-BR', { month:'long' });

  const maxVal = Math.max(prev.total, curr.total, prev.efetuadas, curr.efetuadas, prev.recebidas, curr.recebidas, 1);
  const chartH = 160;
  const scale = v => (v / maxVal) * chartH;

  const groups = [
    { label: capitalize(prevLabel), efetuadas: prev.efetuadas, recebidas: prev.recebidas, total: prev.total },
    { label: capitalize(currLabel), efetuadas: curr.efetuadas, recebidas: curr.recebidas, total: curr.total },
  ];

  const barW = 26, gapInner = 8, gapGroup = 64;
  const groupW = barW * 3 + gapInner * 2;
  const svgW = groupW * 2 + gapGroup + 60;
  const svgH = chartH + 60;

  let bars = '';
  groups.forEach((g, gi) => {
    const groupX = 30 + gi * (groupW + gapGroup);
    const vals = [
      { v: g.efetuadas, color: 'var(--efetuada)' },
      { v: g.recebidas, color: 'var(--recebida)' },
      { v: g.total, color: '#4a5566' },
    ];
    vals.forEach((item, i) => {
      const x = groupX + i * (barW + gapInner);
      const h = Math.max(scale(item.v), item.v > 0 ? 3 : 0);
      const y = chartH - h + 20;
      bars += `<rect x="${x}" y="${y}" width="${barW}" height="${h}" rx="4" fill="${item.color}"/>`;
      bars += `<text x="${x + barW/2}" y="${y - 8}" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#8b97a5">${item.v}</text>`;
    });
    bars += `<text x="${groupX + groupW/2}" y="${chartH + 44}" text-anchor="middle" font-family="Manrope, sans-serif" font-size="13" font-weight="700" fill="#eef2f6">${g.label}</text>`;
  });

  document.getElementById('monthChart').innerHTML = `
    <div class="chart-legend">
      <div class="item"><span class="swatch" style="background:var(--efetuada)"></span>Efetuadas</div>
      <div class="item"><span class="swatch" style="background:var(--recebida)"></span>Recebidas</div>
      <div class="item"><span class="swatch" style="background:#4a5566"></span>Total</div>
    </div>
    <svg viewBox="0 0 ${svgW} ${svgH}" style="width:100%; max-width:480px; height:auto; display:block;">
      <line x1="0" y1="${chartH + 20}" x2="${svgW}" y2="${chartH + 20}" stroke="#1f2733" stroke-width="1"/>
      ${bars}
    </svg>`;
}

function capitalize(s){ return s.charAt(0).toUpperCase() + s.slice(1); }

// ---------- Table render ----------
function formatDateTime(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('pt-BR') + ' · ' + d.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
}

function getFilters(){
  return {
    date: document.getElementById('filterDate').value,
    chamada: document.getElementById('filterChamada').value,
    tipo: document.getElementById('filterTipo').value,
    search: document.getElementById('filterSearch').value.trim().toLowerCase()
  };
}

function applyFilters(list){
  const f = getFilters();
  return list.filter(c => {
    if (f.date){
      const d = new Date(c.dataHora);
      const localDate = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
      if (localDate !== f.date) return false;
    }
    if (f.chamada && c.tipoChamada !== f.chamada) return false;
    if (f.tipo && c.tipoLigacao !== f.tipo) return false;
    if (f.search){
      const hay = [c.nome, c.cpf, c.instalacao, c.protocolo].join(' ').toLowerCase();
      if (!hay.includes(f.search)) return false;
    }
    return true;
  });
}

function renderTable(){
  const list = applyFilters(calls).slice().sort((a,b) => new Date(b.dataHora) - new Date(a.dataHora));
  const body = document.getElementById('callsBody');
  const empty = document.getElementById('emptyState');

  if (list.length === 0){
    body.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  body.innerHTML = list.map(c => `
    <tr data-id="${c.id}">
      <td class="mono">${formatDateTime(c.dataHora)}</td>
      <td><span class="badge ${c.tipoChamada}">${c.tipoChamada === 'efetuada' ? 'Efetuada' : 'Recebida'}</span></td>
      <td><span class="tag">${c.tipoLigacao}</span></td>
      <td>${escapeHtml(c.nome)}</td>
      <td class="mono">${escapeHtml(c.cpf || '—')}</td>
      <td class="mono">${escapeHtml(c.instalacao || '—')}</td>
      <td class="mono">${escapeHtml(c.protocolo || '—')}</td>
      <td class="obs-cell">${escapeHtml(c.observacao || '—')}</td>
      <td><button class="del-btn" title="Excluir" data-id="${c.id}">✕</button></td>
    </tr>
  `).join('');
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function renderAll(){
  renderStats();
  renderMonthChart();
  renderTable();
}

// ---------- Form ----------
document.getElementById('callForm').addEventListener('submit', function(e){
  e.preventDefault();
  const tipoChamada = document.querySelector('input[name="tipoChamada"]:checked').value;
  const record = {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2,7),
    nome: document.getElementById('nome').value.trim(),
    cpf: document.getElementById('cpf').value.trim(),
    instalacao: document.getElementById('instalacao').value.trim(),
    protocolo: document.getElementById('protocolo').value.trim(),
    tipoChamada,
    tipoLigacao: document.getElementById('tipoLigacao').value,
    observacao: document.getElementById('observacao').value.trim(),
    dataHora: new Date().toISOString()
  };
  calls.push(record);
  saveCalls(calls);
  this.reset();
  document.getElementById('tc-efetuada').checked = true;
  renderAll();
});

// ---------- Filters ----------
['filterDate','filterChamada','filterTipo','filterSearch'].forEach(id => {
  document.getElementById(id).addEventListener('input', renderTable);
});
document.getElementById('clearFilters').addEventListener('click', () => {
  document.getElementById('filterDate').value = '';
  document.getElementById('filterChamada').value = '';
  document.getElementById('filterTipo').value = '';
  document.getElementById('filterSearch').value = '';
  renderTable();
});

// ---------- Delete ----------
document.getElementById('callsBody').addEventListener('click', (e) => {
  const btn = e.target.closest('.del-btn');
  if (!btn) return;
  const id = btn.dataset.id;
  if (!confirm('Excluir esta ligação do histórico?')) return;
  calls = calls.filter(c => c.id !== id);
  saveCalls(calls);
  renderAll();
});

renderAll();
</script>
</body>
</html>
